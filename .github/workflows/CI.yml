name: Hybrid-Selenium and RestAssured CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
      timezone: "Africa/Johannesburg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Run Selenium TestNG Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run Selenium tests
        run: mvn -B clean test

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14